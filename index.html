    <script>
      (function() {
        // Intercept browser extension injected errors (e.g. MetaMask, web3 wallets, content scripts)
        // at the earliest possible stage in sandboxed iframes.
        function isExtensionError(msg, src) {
          if (!msg && !src) return false;
          var str = (String(msg) + ' ' + String(src)).toLowerCase();
          return str.indexOf('metamask') !== -1 ||
                 str.indexOf('ethereum') !== -1 ||
                 str.indexOf('web3') !== -1 ||
                 str.indexOf('chrome-extension') !== -1 ||
                 str.indexOf('moz-extension') !== -1 ||
                 str.indexOf('safari-extension') !== -1 ||
                 str.indexOf('evm') !== -1;
        }

        window.addEventListener('error', function(e) {
          if (isExtensionError(e.message || (e.error && e.error.message), e.filename)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = typeof reason === 'string' ? reason : (reason && reason.message) || '';
          if (isExtensionError(msg, '')) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
